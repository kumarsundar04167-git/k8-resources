apiVersion: v1
kind: pod
metadata:
    name: resources
    labels:
      project: roboshop
      environment: dev
      purpose: poc

spec:
    containers:
      - name: nginx
        image: nginx
        resources:
          requests: # soft limit
            cpu: "100m" # 1000m is 1cpu
            memory: "128Mi"
          limits: # hard limit
            cpu: "150m"
            memory: "256Mi"