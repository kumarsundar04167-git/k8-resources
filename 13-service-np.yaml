apiVersion: v1
kind: service
metadata:
   name: nginx-np
   labels: 
      project: roboshop
      environment: dev
spec:
   type: NodePort
   selectors:
      project: roboshop
      component: frontend
      tier: frontend
   ports:
      - protocol: TCP
        port: 80
        targetport: 80
        nodeport: 30007

