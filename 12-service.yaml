apiVersion: v1
kind: service
metadata:
   name: nginx
   labels: 
      project: roboshop
      environment: dev
spec:
   selectors:
      project: roboshop
      component: frontend
      tier: frontend
   ports:
      - protocol: TCP
        port: 80
        targetport: 80

---

apiVersion: v1
kind: pod
metadata:
  name: nginx
  labels:
    project: roboshop
    environment: dev
    tier: frontend
    component: frontend
spec:
  containers:
     - name: nginx
       image: nginx